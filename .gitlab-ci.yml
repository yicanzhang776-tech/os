stages:
  - verify

default:
  image: rust:latest
  before_script:
    - rustup target add riscv64gc-unknown-none-elf
    - rustup component add rustfmt clippy
    - apt-get update
    - apt-get install -y --no-install-recommends qemu-system-misc
    - chmod +x scripts/*.sh

.verify-common: &verify_common
  stage: verify
  script:
    - scripts/check-env.sh
    - cargo fmt --all -- --check
    - cargo build -p ai-os-kernel
    - cargo clippy -p ai-os-kernel -- -D warnings

.verify-solution: &verify_solution
  <<: *verify_common

.verify-starter: &verify_starter
  <<: *verify_common

verify:p0:
  <<: *verify_solution
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/p0-minimal-qemu-baseline"'
  script:
    - scripts/check-env.sh
    - cargo fmt --all -- --check
    - cargo build -p ai-os-kernel
    - cargo clippy -p ai-os-kernel -- -D warnings
    - scripts/test-qemu.sh --name P0 --marker "[P0] PASS" --log target/qemu-p0.log

verify:lab1-starter:
  <<: *verify_starter
  rules:
    - if: '$CI_COMMIT_BRANCH == "lab1-starter"'
  script:
    - scripts/check-env.sh
    - cargo fmt --all -- --check
    - cargo build -p ai-os-kernel
    - cargo clippy -p ai-os-kernel -- -D warnings
    - scripts/test-qemu.sh --name Lab1 --marker "[Lab1] PASS" --mode expect-incomplete --require "[Lab1] TODO" --log target/qemu-lab1.log

verify:lab1-solution:
  <<: *verify_solution
  rules:
    - if: '$CI_COMMIT_BRANCH == "lab1-solution"'
  script:
    - scripts/check-env.sh
    - cargo fmt --all -- --check
    - cargo build -p ai-os-kernel
